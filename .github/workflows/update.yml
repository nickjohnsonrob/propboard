name: update-propboard

on:
  schedule:
    # Re-scrape + rebuild every 2 hours during the NFL window (ET evenings).
    # GitHub Actions cron uses UTC. NFL Sundays run ~17:00-03:00 UTC.
    - cron: '17,19,21,23,1,3 * * 0'
    - cron: '17,21,1 * * *'          # lighter cadence Mon-Sat
  workflow_dispatch: {}              # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape + build
        working-directory: .
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scrape_board.py
          python3 build.py
          # archive a dated snapshot for history
          cp output/board.json "output/board-$(date -u +%Y-%m-%d).json"
          # GH Pages serves repo root -> put latest page there
          cp output/index.html index.html
      - name: Commit and push if changed
        run: |
          git config user.name "propboard-bot"
          git config user.email "propboard-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto-update board $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
