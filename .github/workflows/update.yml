name: update-propboard

on:
  schedule:
    # Re-scrape + rebuild on a cadence. GitHub Actions cron is UTC and only
    # accepts standard POSIX 5-field expressions (no minute lists like 17,19).
    # Sunday (day 0): every 2 hours from 16:00 UTC (noon ET) through 06:00 UTC.
    - cron: '0 16-23/2,0-6/2 * * 0'
    # Mon-Sat: 3 updates a day (morning / evening / late night UTC).
    - cron: '0 6,18,23 * * 1-6'
  workflow_dispatch: {}              # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape + build
        working-directory: .
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scrape_board.py
          python3 build.py
          # archive a dated snapshot for history
          cp output/board.json "output/board-$(date -u +%Y-%m-%d).json"
          # GH Pages serves repo root -> put latest page there
          cp output/index.html index.html
      - name: Commit and push if changed
        run: |
          git config user.name "propboard-bot"
          git config user.email "propboard-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto-update board $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
