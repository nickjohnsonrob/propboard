const $ = s => document.querySelector(s);
const mkSel = $('#m');
(DATA.markets||[]).forEach(mk => {
  const o = document.createElement('option'); o.value = mk; o.textContent = DATA.marketMap?(DATA.marketMap[mk]||mk):mk;
  mkSel.appendChild(o);
});
function fmt(px){ if(px==null) return '<span class="px">—</span>';
  const n = +px; const c = n > 0 ? 'g' : (n < 0 ? 'a' : '');
  return '<span class="'+c+'">'+px+'</span>'; }
function pctCls(v){ return v >= 70 ? 'g' : (v >= 60 ? 'a' : ''); }
function edgeCls(v){ return v >= 20 ? 'g' : (v >= 10 ? 'a' : ''); }
function render(){
  const q = ($('#q').value||'').toLowerCase();
  const mk = $('#m').value; const s = $('#s').value; const hideLocked = $('#l').checked;
  const rows = DATA.rows.filter(r =>
    (!q || (r.name+' '+(r.team||'')+' '+(r.game||'')+' '+(r.pos||'')).toLowerCase().includes(q)) &&
    (!mk || r.market === mk) &&
    (!s || r.side === s) &&
    (!hideLocked || !r.locked));
  rows.sort((a,b) => b.hist - a.hist || b.edge - a.edge);
  $('#count').textContent = rows.length + ' of ' + DATA.rows.length + ' props';
  $('#tb').innerHTML = rows.map(r => `<tr${r.locked?' class="locked"':''}>
    <td class="px">${r.game}${r.locked?' <span class="lk">LOCKED</span>':''}</td>
    <td><b>${r.name}</b></td>
    <td class="px">${r.pos||'—'}</td>
    <td class="px">${r.prop||r.market||'—'}</td>
    <td><b>${r.side} ${r.line}</b> <span class="px">${r.locked?'':fmt(r.price)+' '+(r.book||'')}</span></td>
    <td class="h">${fmt(r.dk)}</td>
    <td class="h ${pctCls(r.hist)}">${r.hist}% <span class="sn">(${r.sample||0})</span></td>
    <td class="h ${pctCls(r.mkt==null?0:r.mkt)}">${r.mkt==null?'—':r.mkt+'%'}</td>
    <td class="e ${edgeCls(r.edge)}">${r.edge>0?'+':''}${r.edge}</td>
  </tr>`).join('');
}
$('#q').addEventListener('input', render);
$('#m').addEventListener('change', render);
$('#s').addEventListener('change', render);
$('#l').addEventListener('change', render);
$('#meta').textContent = (DATA.date_label||'') + ' · ' + (DATA.sport||'') + ' ' + (DATA.week||'') + ' · ' + DATA.generated;
$('#foot').textContent = DATA.rows.length + ' props across ' + (DATA.markets||[]).length + ' markets · snapshot from BetIQ (best-across-books; DK column = DraftKings where quoted) · lines move — verify on the book · research only · 21+ · no markets for Sacks/Targets (see README).';
render();
