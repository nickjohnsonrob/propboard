const $ = s => document.querySelector(s);
const mkSel = $('#m');
(DATA.markets||[]).forEach(mk => {
  const o = document.createElement('option'); o.value = mk; o.textContent = DATA.marketMap?(DATA.marketMap[mk]||mk):mk;
  mkSel.appendChild(o);
});
function fmt(px){ if(px==null) return '<span class="px">—</span>';
  const n = +px; const c = n > 0 ? 'g' : (n < 0 ? 'a' : '');
  return '<span class="'+c+'">'+px+'</span>'; }
function pctCls(v){ return v >= 70 ? 'g' : (v >= 60 ? 'a' : ''); }
function edgeCls(v){ return v >= 20 ? 'g' : (v >= 10 ? 'a' : ''); }
function render(){
  const q = ($('#q').value||'').toLowerCase();
  const mk = $('#m').value; const s = $('#s').value; const hideLocked = $('#l').checked;
  const rows = DATA.rows.filter(r =>
    (!q || (r.name+' '+(r.team||'')+' '+(r.game||'')+' '+(r.pos||'')).toLowerCase().includes(q)) &&
    (!mk || r.market === mk) &&
    (!s || r.side === s) &&
    (!hideLocked || !r.locked));

  $('#count').textContent = rows.length + ' of ' + DATA.rows.length + ' props';
  $('#tb').innerHTML = rows.map(r => `<tr${r.locked?' class="locked"':''}>

  </tr>`).join('');
}
