    <td class="h ${pctCls(r.hist)}">${r.hist}%</td>
    <td class="h ${pctCls(r.mkt==null?0:r.mkt)}">${r.mkt==null?'—':r.mkt+'%'}</td>
    <td class="e ${edgeCls(r.edge)}">${r.edge>0?'+':''}${r.edge}</td>
  </tr>`).join('');
  $('#foot').textContent = DATA.rows.length+' props · generated '+DATA.generated+' · snapshot from BetIQ (best-across-books, DK column = DraftKings price where quoted) · lines move — verify on the book before betting · 21+ · for research, not advice.';
}
$('#q').addEventListener('input', render);
$('#s').addEventListener('change', render);
$('#l').addEventListener('change', render);
$('#meta').textContent = DATA.date_label + ' · ' + DATA.sport + ' ' + DATA.week + ' · ' + DATA.generated;
render();
</script>
</body>
</html>
